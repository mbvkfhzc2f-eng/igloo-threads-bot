name: Threads istatistikleri

# Her sabah tüm gönderilerin görüntülenme/beğeni/yorum sayılarını ve takipçi sayısını çeker,
# insights.json (ham veri) ve insights.md (seri ve saat bazında rapor) dosyalarını günceller.
# Token'da threads_manage_insights izni yoksa yalnızca uyarı verir; paylaşımlar etkilenmez.
on:
  schedule:
    - cron: '37 4 * * *'          # 07:37 Türkiye saati
  # GitHub'ın zamanlayıcısı bu depoda gecikebiliyor ya da hiç çalışmayabiliyor. Bu yüzden sabahki ilk tetik (09:11)
  # de istatistikleri çeker; günün diğer tetiklerinde bu iş akışı hemen biter.
  push:
    branches: [main]
    paths: ['.tick']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Günde bir kez
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$(TZ=Europe/Istanbul date +%H)" != "09" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sabah tetiği değil; istatistikler günde bir kez, 09:11 tetiğinde çekiliyor."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main

      - name: İstatistikleri çek
        if: steps.gate.outputs.run == 'true'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 insights.py

      - name: Raporu kaydet
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "igloo-bot"
          git config user.email "igloo-bot@users.noreply.github.com"
          git add -A -- insights.json insights.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "İstatistikler"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi
